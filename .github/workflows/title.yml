name: title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The pull request title becomes the commit on main, so it follows Conventional Commits.
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[a-z].*[^.]$
          subjectPatternError: The subject starts lower-case and ends without a full stop.
