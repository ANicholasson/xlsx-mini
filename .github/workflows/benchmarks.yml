name: benchmarks

on:
  pull_request:
    # Only what can change performance: the source, the suites, the build and this workflow. The
    # package has no runtime dependencies, so a dependency bump cannot.
    paths:
      - "src/**"
      - "bench/**"
      - "tsconfig.build.json"
      - ".github/workflows/benchmarks.yml"

permissions:
  contents: read

# A new push to the same branch supersedes a run in progress.
concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One job per runtime, side by side: each compares the two builds on its own runner, and no
    # runtime waits for another.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Node
            runtime: node
            command: node
          - name: Bun
            runtime: bun
            command: ./node_modules/.bin/bun
          - name: Deno
            runtime: deno
            command: ./node_modules/.bin/deno run --allow-all --no-lock
    # Read-only on purpose: this job runs the dependencies and the package, so no write scope and
    # no persisted credential is within their reach. Results leave as an artifact.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # The pull request's base commit, the one the merge ref was made from, built with this
      # checkout's compiler: the package has no runtime dependencies, so its dist/ runs on its own.
      - name: Build the base alongside
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git worktree add base-tree "$BASE_SHA"
          ./node_modules/.bin/tsc -p base-tree/tsconfig.build.json
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "COMMIT=$HEAD_SHA" >> "$GITHUB_ENV"

      - name: Benchmark
        env:
          RUNTIME: ${{ matrix.runtime }}
          RUNTIME_COMMAND: ${{ matrix.command }}
        run: $RUNTIME_COMMAND bench/run.ts --base base-tree/dist --json "bench/results/$RUNTIME.json" --commit "$COMMIT" --base-commit "$BASE_SHA"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results-${{ matrix.runtime }}
          path: bench/results/*.json
          retention-days: 7

  comment:
    name: Report on the pull request
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The one write scope a pull request gets, in a job that runs only the report script, which
    # needs no dependencies.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-results-*
          merge-multiple: true
          path: bench/results

      - name: Post or update the comment
        # A pull request from a fork gets a read-only token; the report then stays in the log.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          node bench/report.ts --head bench/results --out bench/results/report.md \
            --base-label "$BASE_REF" --head-label "this pull request"
          cat bench/results/report.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | startswith("<!-- xlsx-mini-benchmarks -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@bench/results/report.md >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" -F body=@bench/results/report.md >/dev/null
          fi
