name: benchmarks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch supersedes a run in progress.
concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Node, Bun and Deno
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Read-only on purpose: this job runs the dependencies and the package, so no write scope and
    # no persisted credential is within their reach. Results leave as an artifact.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # On a pull request the checkout is the merge ref; the report names the head commit instead.
      - name: Name the commit under test
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "COMMIT=${HEAD_SHA:-$GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Benchmark on Node
        run: node bench/run.ts --json bench/results/node.json --commit "$COMMIT"
      - name: Benchmark on Bun
        run: ./node_modules/.bin/bun bench/run.ts --json bench/results/bun.json --commit "$COMMIT"
      - name: Benchmark on Deno
        run: ./node_modules/.bin/deno run --allow-all --no-lock bench/run.ts --json bench/results/deno.json --commit "$COMMIT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: bench/results/*.json
          retention-days: 7

  comment:
    name: Report on the pull request
    if: github.event_name == 'pull_request'
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The one write scope a pull request gets, in a job that runs only the report script, which
    # needs no dependencies.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bench-results
          path: bench/results

      - name: Fetch the latest results on main
        run: |
          if git ls-remote --exit-code --heads origin benchmarks >/dev/null; then
            git fetch --depth=1 origin benchmarks
            git worktree add bench-branch FETCH_HEAD
          else
            mkdir -p bench-branch
          fi

      - name: Post or update the comment
        # A pull request from a fork gets a read-only token; the report then stays in the log.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node bench/report.ts --head bench/results --base bench-branch/latest --history bench-branch/history.json \
            --out bench/results/report.md --base-label main --head-label "this pull request"
          cat bench/results/report.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | startswith("<!-- xlsx-mini-benchmarks -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@bench/results/report.md >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" -F body=@bench/results/report.md >/dev/null
          fi

  record:
    name: Record on the benchmarks branch
    if: github.event_name == 'push'
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The one job that may write to the repository: it pushes the branch the workflow owns, from
    # the report script alone.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bench-results
          path: bench/results

      - name: Record the run
        run: |
          if git ls-remote --exit-code --heads origin benchmarks >/dev/null; then
            git fetch --depth=1 origin benchmarks
            git worktree add bench-branch FETCH_HEAD
          else
            git worktree add --orphan -b benchmarks bench-branch
          fi
          node bench/report.ts --head bench/results --append-history bench-branch/history.json --svg bench-branch/benchmarks.svg
          mkdir -p bench-branch/latest
          cp bench/results/*.json bench-branch/latest/
          cd bench-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "bench: record ${GITHUB_SHA:0:7}" || echo "nothing to record"
          git push origin HEAD:benchmarks
