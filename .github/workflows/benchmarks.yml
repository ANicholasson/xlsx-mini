name: benchmarks

on:
  pull_request:

permissions:
  contents: read

# A new push to the same branch supersedes a run in progress.
concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Node, Bun and Deno
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Read-only on purpose: this job runs the dependencies and the package, so no write scope and
    # no persisted credential is within their reach. Results leave as an artifact.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # The base of the pull request, built with this checkout's compiler: the package has no
      # runtime dependencies, so its dist/ runs on its own.
      - name: Build main alongside
        run: |
          git fetch --depth=1 origin main
          git worktree add base-tree FETCH_HEAD
          ./node_modules/.bin/tsc -p base-tree/tsconfig.build.json
          echo "BASE_SHA=$(git -C base-tree rev-parse HEAD)" >> "$GITHUB_ENV"

      # The checkout is the merge ref; the report names the head commit instead.
      - name: Name the commit under test
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "COMMIT=${HEAD_SHA:-$GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Benchmark on Node
        run: node bench/run.ts --base base-tree/dist --json bench/results/node.json --commit "$COMMIT" --base-commit "$BASE_SHA"
      - name: Benchmark on Bun
        run: ./node_modules/.bin/bun bench/run.ts --base base-tree/dist --json bench/results/bun.json --commit "$COMMIT" --base-commit "$BASE_SHA"
      - name: Benchmark on Deno
        run: ./node_modules/.bin/deno run --allow-all --no-lock bench/run.ts --base base-tree/dist --json bench/results/deno.json --commit "$COMMIT" --base-commit "$BASE_SHA"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: bench/results/*.json
          retention-days: 7

  comment:
    name: Report on the pull request
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The one write scope a pull request gets, in a job that runs only the report script, which
    # needs no dependencies.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bench-results
          path: bench/results

      - name: Post or update the comment
        # A pull request from a fork gets a read-only token; the report then stays in the log.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node bench/report.ts --head bench/results --out bench/results/report.md \
            --base-label main --head-label "this pull request"
          cat bench/results/report.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | startswith("<!-- xlsx-mini-benchmarks -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@bench/results/report.md >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" -F body=@bench/results/report.md >/dev/null
          fi
