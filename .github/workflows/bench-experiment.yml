name: bench experiment

# Temporary, for issue 49: the harness run long on the runner with every timing kept, two copies of
# one build and this build against the base, to see what the runner's noise is.
# Removed before the pull request merges.
on:
  pull_request:
    paths:
      - ".github/workflows/bench-experiment.yml"

permissions:
  contents: read

concurrency:
  group: bench-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experiment:
    name: ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: node
            command: node
          - runtime: bun
            command: ./node_modules/.bin/bun
          - runtime: deno
            command: ./node_modules/.bin/deno run --allow-all --no-lock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Build the base alongside
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git worktree add base-tree "$BASE_SHA"
          ./node_modules/.bin/tsc -p base-tree/tsconfig.build.json
          cp -R dist dist-copy
          mkdir -p experiment

      - name: Two copies of this build, six rounds, every timing kept
        env:
          RUNTIME_COMMAND: ${{ matrix.command }}
        run: $RUNTIME_COMMAND bench/run.ts --dist dist --base dist-copy --rounds 6 --iterations 6 --json experiment/copies.json --samples experiment/copies-samples.json

      - name: This build and the base, six rounds, every timing kept
        env:
          RUNTIME_COMMAND: ${{ matrix.command }}
        run: $RUNTIME_COMMAND bench/run.ts --dist dist --base base-tree/dist --rounds 6 --iterations 6 --json experiment/base.json --samples experiment/base-samples.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-experiment-${{ matrix.runtime }}
          path: experiment/*.json
          retention-days: 7
