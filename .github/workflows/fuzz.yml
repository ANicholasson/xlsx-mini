name: fuzz

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      seed:
        description: The seed to mutate the corpus from. Empty takes the run's id.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Read-only on purpose: this job runs the dependencies and the package, so no write scope and no
    # persisted credential is within their reach. The text of an issue leaves as an artifact.
    permissions:
      contents: read
    outputs:
      failed: ${{ steps.issue.outputs.failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # A fresh seed per run: the run's id, unless a seed was asked for. Running the job again keeps
      # its seed, so a failure there reads the same mutations.
      - name: Mutate the corpus for 30 minutes
        env:
          SEED: ${{ inputs.seed || github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node test/fuzz/fuzz.ts --seed "$SEED" --mutations 1000000000 --minutes 30 --issue fuzz-issue.md --run "$RUN_URL"

      - name: Keep the text of the issue
        id: issue
        if: always()
        run: |
          if [ -f fuzz-issue.md ]; then echo "failed=true" >> "$GITHUB_OUTPUT"; fi
      - if: always() && steps.issue.outputs.failed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-issue
          path: fuzz-issue.md
          retention-days: 30

  report:
    name: Open or update the issue
    needs: fuzz
    if: always() && needs.fuzz.outputs.failed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The one write scope, in a job that runs no dependency: one issue at a time, and a later
    # failure comments on the open one.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fuzz-issue
      - name: Comment on the open issue, or open one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&creator=github-actions%5Bbot%5D&per_page=100" --paginate \
            --jq '.[] | select(.pull_request == null) | select(.body // "" | startswith("<!-- xlsx-mini-fuzz -->")) | .number' | head -1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file fuzz-issue.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Seeded fuzzing found a failure of the reader" --body-file fuzz-issue.md
          fi
